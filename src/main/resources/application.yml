spring:
  application:
    name: tayjava-spring-security-lab
  datasource:
    url: jdbc:h2:mem:tayjava-sec;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:lab-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:lab-google-client-secret}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:lab-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:lab-github-client-secret}
            scope: read:user, user:email

server:
  port: 8080

tayjava:
  mfa:
    # Lab-only fixed OTP — never use a fixed code in production.
    lab-code: ${TAYJAVA_MFA_LAB_CODE:123456}
  jwt:
    # Required — set via env (no in-repo secret). Tests override in src/test/resources.
    secret: ${TAYJAVA_JWT_SECRET}
    issuer: https://tayjava.com
    audience: tayjava-api
    access-token-ttl: PT15M
    refresh-token-ttl: P14D

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.springframework.security: INFO

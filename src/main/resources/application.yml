spring:
  application:
    name: tayjava-spring-security-lab

server:
  port: 9000

# Lab defaults — override via env for anything beyond local exercises.
tayjava:
  oauth:
    web-client-secret: ${TAYJAVA_WEB_CLIENT_SECRET:lab-web-secret}
    partner-client-secret: ${TAYJAVA_PARTNER_CLIENT_SECRET:lab-partner-secret}

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.springframework.security: INFO

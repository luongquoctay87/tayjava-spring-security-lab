spring:
  application:
    name: tayjava-spring-security-lab

server:
  port: 8080

tayjava:
  keycloak:
    client-id: tayjava-api
  # Lab HS256 secret for offline tests / local minting — not a Keycloak signing key.
  jwt:
    secret: ${TAYJAVA_JWT_SECRET:tayjava-lab-demo-secret-32bytes!!}

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.springframework.security: INFO

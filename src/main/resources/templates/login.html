<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>TayJava Login</title></head>
<body>
  <h1>Sign in</h1>
  <p th:if="${param.error}">Invalid username or password.</p>
  <p th:if="${param.logout}">You have been logged out.</p>
  <form th:action="@{/login}" method="post">
    <div><label>Username <input type="text" name="username" autocomplete="username"/></label></div>
    <div><label>Password <input type="password" name="password" autocomplete="current-password"/></label></div>
    <div><label><input type="checkbox" name="remember-me"/> Remember me</label></div>
    <button type="submit">Login</button>
  </form>

    <p class="oauth">
      <a href="/oauth2/authorization/google">Sign in with Google</a>
      ·
      <a href="/oauth2/authorization/github">Sign in with GitHub</a>
    </p>

</body>
</html>

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: lab-google-client-id
            client-secret: lab-google-client-secret
            scope: openid, profile, email
          github:
            client-id: lab-github-client-id
            client-secret: lab-github-client-secret
            scope: read:user, user:email

tayjava:
  mfa:
    lab-code: "123456"
  jwt:
    secret: lab-test-secret-must-be-32chars!!
    issuer: https://tayjava.com
    audience: tayjava-api
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
